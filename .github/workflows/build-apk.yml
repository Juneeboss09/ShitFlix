name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable debug APK
        run: ./gradlew assembleStableDebug

      - name: Build stable release APK
        run: ./gradlew assembleStableRelease

      - name: Upload stable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Shitflix-stable-debug
          path: app/build/outputs/apk/stable/debug/*.apk

      - name: Upload stable release APK
        uses: actions/upload-artifact@v4
        with:
          name: Shitflix-stable-release
          path: app/build/outputs/apk/stable/release/*.apk
